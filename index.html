<!doctype html>
<html lang="pt-BR">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#050305">
	<title>O que reparo em você</title>
	<link rel="stylesheet" href="indes.css">
	<script src="index.js" defer></script>
</head>
<body>
	<canvas id="falling-hearts" aria-hidden="true"></canvas>
	<main class="scene">
		<h1 class="visually-hidden">Um coração feito de carinho</h1>
		<div class="heart-stage">
			<canvas id="word-heart" role="img" aria-label="Um coração animado formado por palavras de amor"></canvas>
		</div>
		<figure class="photo-frame photo-frame--accent-free" aria-label="Desenho do Snoopy segurando flores">
			<img src="snoopy-bouquet.png" alt="Snoopy segurando um buquê de flores">
		</figure>
		<figure class="photo-frame photo-frame--bottom-right photo-frame--sticker" aria-label="Desenho fofo do Snoopy">
			<img src="snoopy-blush.png" alt="Desenho do Snoopy com as bochechas coradas">
		</figure>
		<figure class="photo-frame photo-frame--extra photo-frame--cutout" aria-label="Ursinho segurando uma rosa">
			<img src="ursinho.png" alt="Ursinho fofo segurando uma rosa vermelha">
		</figure>
		<figure class="photo-frame photo-frame--accent-free photo-frame--cat photo-frame--cutout" aria-label="Dois gatinhos apaixonados">
			<img src="gatinhos.png" alt="Dois gatinhos abraçados com corações ao redor">
		</figure>

		<button class="replay-button" id="replay-heart" type="button">
			<span aria-hidden="true">↻</span>
			Refazer coração
		</button>
		<p class="visually-hidden">Amo seus beijinhos. Amo seu sorriso. Amo seus abraços. Amo seus risos. Amo seus cachinhos. Amo tudo em você.</p>
	</main>
</body>
</html>
