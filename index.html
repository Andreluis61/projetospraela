<!doctype html>
<html lang="pt-BR">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#050305">
	<title>O que reparo em você</title>
	<link rel="stylesheet" href="indes.css">
	<script src="index.js" defer></script>
</head>
<body>
	<canvas id="falling-hearts" aria-hidden="true"></canvas>
	<main class="scene">
		<h1 class="visually-hidden">Um coração feito de carinho</h1>
		<div class="heart-stage">
			<canvas id="word-heart" role="img" aria-label="Um coração animado formado por palavras de amor"></canvas>
		</div>
		<figure class="photo-frame photo-frame--left" aria-label="Foto especial do casal">
			<img src="https://i.pinimg.com/originals/02/11/db/0211db1eab06fa1c9e64b71b346b7f85.jpg" alt="Foto do casal em um momento especial">
		</figure>
		<figure class="photo-frame photo-frame--right" aria-label="Outra foto especial do casal">
			<img src="https://i.pinimg.com/736x/26/48/b1/2648b1d81c39915df4d61f73748bb483.jpg" alt="Outra foto do casal em um momento especial">
		</figure>
		<figure class="photo-frame photo-frame--pulse" aria-label="Imagem romântica que aparece e desaparece">
			<img src="https://i.pinimg.com/736x/09/43/0a/09430a1c538c238f1d25e06859e14d9b.jpg" alt="Imagem romântica">
		</figure>
		<figure class="photo-frame photo-frame--accent-free" aria-label="Mais uma foto especial">
			<img src="https://i.pinimg.com/1200x/bb/39/1e/bb391ee8fdd99832a9bfe0a6a013cba3.jpg" alt="Foto especial">
		</figure>
		<figure class="photo-frame photo-frame--bottom-right" aria-label="Foto especial no canto inferior direito">
			<img src="https://i.pinimg.com/1200x/86/6c/27/866c2782277d83bdb01708b79e4f74a0.jpg" alt="Imagem especial compartilhada pelo Pinterest">
		</figure>
		<figure class="photo-frame photo-frame--extra" aria-label="Mais uma imagem especial">
			<img src="https://i.pinimg.com/1200x/f8/62/03/f86203b93d14d6fe9eaf26cc5aeda97e.jpg" alt="Imagem romântica compartilhada pelo Pinterest">
		</figure>
		<button class="replay-button" id="replay-heart" type="button">
			<span aria-hidden="true">↻</span>
			Refazer coração
		</button>
		<p class="visually-hidden">Amo seus beijinhos. Amo seu sorriso. Amo seus abraços. Amo seus risos. Amo seus cachinhos. Amo tudo em você.</p>
	</main>
</body>
</html>
